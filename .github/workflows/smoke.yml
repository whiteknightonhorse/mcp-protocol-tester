name: Smoke (outer tier)

# Э4 (Fable's audit 2026-09-02) — the free, frequent, OUTSIDE-the-box tier.
# Zero secrets: GITHUB_TOKEN below is the workflow's own auto-issued token
# (repo-scoped issue write), never an operator credential. This complements,
# not replaces, the deep 06:00 daily run on the box (tier B) — see this
# workflow's own dead-man check (step 7 in smoke-external.sh) for how the
# two tiers stay honest about each other.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  issues: write
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run outer smoke checks
        id: smoke
        run: bash scripts/smoke-external.sh
        continue-on-error: true

      - name: Find existing open smoke-failure issue
        if: steps.smoke.outcome == 'failure'
        id: find_issue
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'smoke-failure',
            });
            return data.length > 0 ? data[0].number : '';
          result-encoding: string

      - name: Open a new smoke-failure issue
        if: steps.smoke.outcome == 'failure' && steps.find_issue.outputs.result == ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `[Smoke] outer-tier check failed — ${new Date().toISOString().slice(0,10)}`,
              body: 'The outer smoke workflow failed. See the run log:\n' +
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['smoke-failure'],
            });

      - name: Comment on the existing smoke-failure issue
        if: steps.smoke.outcome == 'failure' && steps.find_issue.outputs.result != ''
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: parseInt('${{ steps.find_issue.outputs.result }}', 10),
              body: `Still failing: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Close any open smoke-failure issue on a clean run
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'smoke-failure',
            });
            for (const issue of data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: 'Smoke checks are green again — closing.',
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed',
              });
            }

      - name: Fail the job if smoke checks failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
