name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: |
          for f in $(find src -name "*.js") $(find scripts -name "*.js"); do
            node -c "$f" || exit 1
          done
          echo "All files pass syntax check on Node ${{ matrix.node-version }}"

      # Э1 (Fable's audit, 2026-09-02) — this used to be a dry run against
      # httpbin.org piped through `|| true`, so nothing here could ever fail
      # CI no matter what it found. Replaced with the actual verdict
      # discriminating control the audit requires: a dead server AND a flat
      # "everything is 200 with an empty body" server must BOTH score
      # VERDICT=FAIL. No `|| true` — a broken verdict layer now fails CI.
      - name: Verdict dual-stub control (dead server / flat-200 must both FAIL)
        run: node scripts/test-verdict-fixtures.js
        env:
          NODE_OPTIONS: --max-old-space-size=512
